services:
  minkowski:
    build: .
    image: seminar14-minkowski:cuda117
    runtime: nvidia
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "8888:8888"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      CUDA_HOME: /usr/local/cuda
      TORCH_CUDA_ARCH_LIST: "7.5"
      MAX_JOBS: "2"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: >
      bash -lc "jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --NotebookApp.token='' --NotebookApp.password=''"
